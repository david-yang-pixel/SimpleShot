name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build universal app and DMG (Apple Silicon + Intel)
        run: |
          UNIVERSAL=1 ./scripts/build.sh --dmg
          lipo -info build/SimpleShot.app/Contents/MacOS/SimpleShot
          ls -lh build/SimpleShot.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: SimpleShot
          path: build/SimpleShot.dmg

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest build/SimpleShot.dmg \
            --title "SimpleShot（最新构建）" \
            --notes "自动构建自 ${GITHUB_SHA::7}。下载 SimpleShot.dmg，打开后把 SimpleShot 拖到“应用程序”文件夹。首次打开方法见 README。" \
            --target "$GITHUB_SHA"
